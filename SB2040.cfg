#####################################################################
#   Mellow SB2040 Pro Max V3
#   Driver: TMC2240
#   Accel: LIS2DW
#   CAN UUID: 7ad72d8f7b06

#####################################################################
 
[mcu SB2040]
canbus_uuid: 7ad72d8f7b06
 
#[temperature_sensor SB2040]       No se puede que dos cosas lean la temperatura al mismo tiempo, la lectura la esta realizando para activar ventilador
#sensor_type: temperature_mcu
#sensor_mcu: SB2040
 

#####################################################################
#   FAN
#####################################################################
## Part Cooling Fan - FAN0
[fan]
pin: SB2040:gpio24
 
## Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: SB2040:gpio19
heater: extruder
heater_temp: 50.0

[temperature_fan SB2040_MCU]
pin: SB2040:gpio21
sensor_type: temperature_mcu
sensor_mcu: SB2040
control: watermark
target_temp: 45
min_temp: 0
max_temp: 100
max_power: 1.0


#####################################################################
#   Endstop X
#####################################################################
[stepper_x]
endstop_pin: SB2040:gpio20
 
#####################################################################
#   Neopixel - Stealthburner LEDs
#####################################################################
[neopixel sb_leds]
pin: SB2040:gpio26
chain_count: 16
# Number of LEDs
color_order: GRB
initial_RED: 0.4    #66CCFF
initial_GREEN: 0.8
initial_BLUE: 1
initial_WHITE: 0.0
 
#####################################################################
#   Accelerometer - LIS2DW
#####################################################################
[lis2dw]
cs_pin: SB2040:gpio12
spi_software_sclk_pin: SB2040:gpio2  # Comparte la línea de reloj física SCK
spi_software_mosi_pin: SB2040:gpio3  # Comparte la línea física MOSI
spi_software_miso_pin: SB2040:gpio4  # Comparte la línea física MISO
axes_map: z, y, -x
 
[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20
min_freq: 5
max_freq: 100
accel_per_hz: 75
hz_per_sec: 1
 
