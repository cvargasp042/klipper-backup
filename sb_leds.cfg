# Macros de control para los LEDs del Stealthburner
[gcode_macro _sb_vars]
variable_colors: {
        'logo': {
            'busy':     {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},  # Rojo fuerte
            'cleaning': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},  # Azul puro
            'heating':  {'r': 1.0, 'g': 0.3, 'b': 0.0, 'w': 0.0},  # Naranja fuego
            'homing':   {'r': 0.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},  # Verde brillante
            'leveling': {'r': 1.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},  # Magenta
            'meshing':  {'r': 0.0, 'g': 1.0, 'b': 1.0, 'w': 0.0},  # Cyan
            'off':      {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},  # Apagado
            'printing': {'r': 1.0, 'g': 1.0, 'b': 1.0, 'w': 1.0},  # Blanco total
            'standby':  {'r': 0.2, 'g': 0.2, 'b': 0.2, 'w': 0.2},  # Gris tenue
        },
        'nozzle': {
            'heating':  {'r': 1.0, 'g': 0.3, 'b': 0.0, 'w': 0.0},  # Naranja fuego
            'off':      {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},  # Apagado
            'printing': {'r': 1.0, 'g': 1.0, 'b': 1.0, 'w': 1.0},  # Blanco total
            'standby':  {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},  # Rojo puro
        }
    }
gcode:
    # No borrar esta sección

[gcode_macro STATUS_OFF]
gcode:
    _set_sb_leds_by_name leds="logo,nozzle" color="off"

[gcode_macro STATUS_READY]
gcode:
    _set_sb_leds_by_name leds="logo" color="standby"
    _set_sb_leds_by_name leds="nozzle" color="standby"

[gcode_macro STATUS_BUSY]
gcode:
    _set_sb_leds_by_name leds="logo" color="busy"
    set_nozzle_leds_on

[gcode_macro STATUS_HEATING]
gcode:
    _set_sb_leds_by_name leds="logo,nozzle" color="heating"

[gcode_macro STATUS_LEVELING]
gcode:
    _set_sb_leds_by_name leds="logo" color="leveling"
    set_nozzle_leds_on

[gcode_macro STATUS_HOMING]
gcode:
    _set_sb_leds_by_name leds="logo" color="homing"
    set_nozzle_leds_on

[gcode_macro STATUS_CLEANING]
gcode:
    _set_sb_leds_by_name leds="logo" color="cleaning"
    set_nozzle_leds_on

[gcode_macro STATUS_MESHING]
gcode:
    _set_sb_leds_by_name leds="logo" color="meshing"
    set_nozzle_leds_on

[gcode_macro STATUS_PRINTING]
gcode:
    _set_sb_leds_by_name leds="logo,nozzle" color="printing"

[gcode_macro set_nozzle_leds_on]
gcode:
    _set_sb_leds_by_name leds="nozzle" color="printing"

# Lógica interna de asignación de colores
[gcode_macro _set_sb_leds_by_name]
gcode:
    {% set leds = params.LEDS|string %}
    {% set color = params.COLOR|string %}
    {% set sb_vars = printer["gcode_macro _sb_vars"] %}
    
    {% if 'logo' in leds %}
        {% set logo_color = sb_vars.colors.logo[color] %}
        set_led led=sb_leds idx=1 red={logo_color.r} green={logo_color.g} blue={logo_color.b} white={logo_color.w} transmit=0
        set_led led=sb_leds idx=2 red={logo_color.r} green={logo_color.g} blue={logo_color.b} white={logo_color.w} transmit=1
    {% endif %}
    {% if 'nozzle' in leds %}
        {% set nozzle_color = sb_vars.colors.nozzle[color] %}
        set_led led=sb_leds idx=3 red={nozzle_color.r} green={nozzle_color.g} blue={nozzle_color.b} white={nozzle_color.w} transmit=1
    {% endif %}